<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Telegram Media Downloader</title>
  <link rel="icon" href="icons/icon-32.png">
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <div class="app">
    <aside class="side">
      <div class="brand">
        <img src="icons/icon-48.png" alt="" width="40" height="40">
        <div>
          <strong>Media Downloader</strong>
          <span class="ver"></span>
        </div>
      </div>
      <nav class="nav" aria-label="Sections">
        <a href="#general" data-nav="general">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>
          <span data-key="secGeneral"></span>
        </a>
        <a href="#naming" data-nav="naming">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></svg>
          <span data-key="secNaming"></span>
        </a>
        <a href="#save" data-nav="save">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
          <span data-key="secSave"></span>
        </a>
        <a href="#data" data-nav="data">
          <svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v6c0 1.7 3.1 3 7 3s7-1.3 7-3V6M5 12v6c0 1.7 3.1 3 7 3s7-1.3 7-3v-6"/></svg>
          <span data-key="secData"></span>
        </a>
        <a href="#about" data-nav="about">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>
          <span data-key="secAbout"></span>
        </a>
      </nav>
    </aside>

    <main>
      <section id="general" class="sec">
        <header><h2 data-key="secGeneral"></h2><p data-key="leadGeneral"></p></header>
        <div class="card">
          <div class="row">
            <div class="row-text"><b data-key="lang"></b></div>
            <div class="seg" data-setting="lang">
              <button type="button" value="vi">Tiếng Việt</button>
              <button type="button" value="en">English</button>
            </div>
          </div>
          <div class="row">
            <div class="row-text"><b data-key="connections"></b><small data-key="connectionsRecommended"></small></div>
            <div class="seg" data-setting="connections">
              <button type="button" value="1">1</button>
              <button type="button" value="2">2</button>
              <button type="button" value="3">3</button>
              <button type="button" value="4">4</button>
            </div>
          </div>
        </div>
        <h3 data-key="aqUntil"></h3>
        <div class="choices" data-setting="aqUntil" role="radiogroup">
          <button type="button" class="choice" value="last" role="radio">
            <b data-key="aqUntilLast"></b><small data-key="aqUntilLastDesc"></small>
          </button>
          <button type="button" class="choice" value="end" role="radio">
            <b data-key="aqUntilEnd"></b><small data-key="aqUntilEndDesc"></small>
          </button>
        </div>
        <h3 data-key="fabTitle"></h3>
        <div class="card fab-card">
          <div class="fab-preview" aria-hidden="true">
            <span class="fab-demo"><svg viewBox="0 0 24 24"><path d="M12 3v12m-5-5 5 5 5-5M5 16v4h14v-4"/></svg></span>
          </div>
          <div class="fab-controls">
            <label class="range">
              <span data-key="fabSize"></span><output data-out="fabSize"></output>
              <input type="range" min="40" max="80" step="2" data-range="fabSize">
            </label>
            <label class="range">
              <span data-key="fabFade"></span><output data-out="fabFade"></output>
              <input type="range" min="0" max="80" step="5" data-range="fabFade">
            </label>
            <small data-key="fabHint"></small>
          </div>
        </div>
      </section>

      <section id="naming" class="sec">
        <header><h2 data-key="secNaming"></h2><p data-key="leadNaming"></p></header>
        <div class="preview" aria-live="polite">
          <span data-key="namingPreview"></span>
          <code id="preview"></code>
        </div>
        <div class="choices grid3" data-setting="naming" role="radiogroup">
          <button type="button" class="choice" value="original" role="radio"><b data-key="namingOriginal"></b><code></code></button>
          <button type="button" class="choice" value="date" role="radio"><b data-key="namingDate"></b><code></code></button>
          <button type="button" class="choice" value="seq" role="radio"><b data-key="namingSeq"></b><code></code></button>
          <button type="button" class="choice" value="date_original" role="radio"><b data-key="namingDateOriginal"></b><code></code></button>
          <button type="button" class="choice" value="seq_original" role="radio"><b data-key="namingSeqOriginal"></b><code></code></button>
          <button type="button" class="choice" value="custom" role="radio"><b data-key="namingCustom"></b><code>{…}</code></button>
        </div>
        <div class="card">
          <div class="row stack" id="template-row">
            <div class="row-text"><b data-key="template"></b><small data-key="insertToken"></small></div>
            <input type="text" data-setting="template" maxlength="120" placeholder="{channel}_{date}_{name}" spellcheck="false">
            <div class="chips">
              <button type="button" class="chip" data-token="name"><span data-key="tokName"></span><code>{name}</code></button>
              <button type="button" class="chip" data-token="date"><span data-key="tokDate"></span><code>{date}</code></button>
              <button type="button" class="chip" data-token="time"><span data-key="tokTime"></span><code>{time}</code></button>
              <button type="button" class="chip" data-token="seq"><span data-key="tokSeq"></span><code>{seq}</code></button>
              <button type="button" class="chip" data-token="channel"><span data-key="tokChannel"></span><code>{channel}</code></button>
            </div>
          </div>
          <div class="row">
            <div class="row-text"><b data-key="prefix"></b></div>
            <input type="text" data-setting="prefix" maxlength="60" spellcheck="false">
          </div>
        </div>
      </section>

      <section id="save" class="sec">
        <header><h2 data-key="secSave"></h2><p data-key="leadSave"></p></header>
        <div class="folder">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
          <div class="folder-text">
            <b id="folder-name"></b>
            <small data-key="folderSteps"></small>
          </div>
          <button type="button" class="btn" id="clear-folder" data-key="clearFolder"></button>
        </div>
        <h3 data-key="subfolder"></h3>
        <p class="note" id="subfolder-hint" data-key="subfolderNeedsFolderPage"></p>
        <div class="choices grid3" data-setting="subfolder" role="radiogroup">
          <button type="button" class="choice" value="none" role="radio"><b data-key="subfolderNone"></b></button>
          <button type="button" class="choice" value="date" role="radio"><b data-key="subfolderDate"></b></button>
          <button type="button" class="choice" value="channel" role="radio"><b data-key="subfolderChannel"></b></button>
          <button type="button" class="choice" value="date_channel" role="radio"><b data-key="subfolderDateChannel"></b></button>
          <button type="button" class="choice" value="channel_date" role="radio"><b data-key="subfolderChannelDate"></b></button>
        </div>
        <div class="path"><span data-key="pathExample"></span><code id="path"></code></div>
      </section>

      <section id="data" class="sec">
        <header><h2 data-key="secData"></h2><p data-key="leadData"></p></header>
        <div class="stats">
          <div class="stat">
            <span class="stat-label" data-key="statNext"></span>
            <strong id="seq-value"></strong>
            <button type="button" class="btn" id="reset-seq" data-key="resetSeq"></button>
          </div>
          <div class="stat">
            <span class="stat-label" data-key="statRemembered"></span>
            <strong id="downloaded-value"></strong>
            <small data-key="statRememberedDesc"></small>
            <button type="button" class="btn danger" id="forget" data-key="forgetDownloaded"></button>
          </div>
        </div>
      </section>

      <section id="about" class="sec">
        <header><h2 data-key="secAbout"></h2></header>
        <div class="card">
          <h4 data-key="shortcutsTitle"></h4>
          <dl class="keys">
            <dt><kbd>Ctrl</kbd> <kbd>Shift</kbd> <kbd>M</kbd></dt><dd data-key="scSelect"></dd>
            <dt><kbd>Ctrl</kbd> <kbd>Shift</kbd> <kbd>A</kbd></dt><dd data-key="scAuto"></dd>
            <dt><kbd>Ctrl</kbd> <kbd>Shift</kbd> <kbd>D</kbd></dt><dd data-key="scDownload"></dd>
          </dl>
        </div>
        <div class="card meta">
          <div><span data-key="versionLabel"></span><b class="ver-num"></b></div>
          <div><span data-key="licenseLabel"></span><b>GPL-3.0-or-later</b></div>
          <div><span data-key="sourceLabel"></span><a id="source" target="_blank" rel="noopener"></a></div>
        </div>
      </section>
    </main>
  </div>

  <div class="toast" id="toast" role="status" hidden></div>

  <script src="src/strings.js"></script>
  <script src="options.js"></script>
</body>
</html>
